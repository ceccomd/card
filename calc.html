<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Calcolatrice Mappa Numeri-Parole</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Card-Fonetica">
  <link rel="apple-touch-icon" href="card-192.png">
  <link rel="icon" type="image/png" href="card-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .calculator {
      background-color: var(--surface);
      border-radius: var(--radius);
      padding: 18px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .display {
      background-color: #000;
      color: var(--accent);
      font-size: 1.8em;
      text-align: right;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      min-height: 60px;
      word-wrap: break-word;
      font-weight: 600;
      -webkit-user-select: text;
      user-select: text;
    }
    .operations, .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .operations { margin-bottom: 10px; }
    .calculator button {
      padding: 18px;
      font-size: 1.2em;
      font-weight: 600;
    }
    .calculator button[disabled] {
      background-color: transparent;
      cursor: default;
    }
    #enter { background-color: var(--accent); color: #000; }
  </style>
</head>
<body>
  <button id="installBtn" class="hidden" type="button">Installa app</button>

  <div class="calculator">
    <div class="display" id="display"></div>

    <div class="operations">
      <button id="clear">C</button>
      <button id="delete">⌫</button>
      <button id="enter">Invio</button>
    </div>

    <div class="buttons">
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button onclick="window.location.href='index.html'">⌂ Home</button>
      <button data-value="0">0</button>
      <button disabled></button>
    </div>
  </div>

  <script src="mapping.js"></script>
  <script>
    const display = document.getElementById('display');

    function updateDisplay(value) { display.textContent = value; }

    document.getElementById('clear').addEventListener('click', () => updateDisplay(''));
    document.getElementById('delete').addEventListener('click', () => updateDisplay(display.textContent.slice(0, -1)));
    document.getElementById('enter').addEventListener('click', () => {
      const input = display.textContent;
      const result = [];
      for (let i = 0; i < input.length; i += 2) {
        const num = input.substring(i, i + 2);
        result.push(mapping[num] || `[${num}]`);
      }
      updateDisplay(result.join(' '));
    });

    document.querySelectorAll('.buttons button[data-value]').forEach(button => {
      button.addEventListener('click', () => {
        updateDisplay(display.textContent + button.getAttribute('data-value'));
      });
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
