<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Calcolatrice Mappa Numeri-Parole</title>
  <style>
    /* Grafica in stile iPhone */
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background-color: #333;
      border-radius: 20px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .display {
      background-color: #000;
      color: #0f0;
      font-size: 2em;
      text-align: right;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      min-height: 50px;
      word-wrap: break-word;
    }
    /* Riga operativa in alto */
    .operations {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    /* Griglia dei tasti numerici */
    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    button {
      background-color: #666;
      border: none;
      border-radius: 10px;
      padding: 20px;
      font-size: 1.2em;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:active {
      background-color: #888;
    }
    /* I pulsanti disabilitati (vuoti) non sono cliccabili */
    button[disabled] {
      background-color: transparent;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <!-- Display -->
    <div class="display" id="display"></div>
    
    <!-- Riga operativa: C, ⌫, Invio -->
    <div class="operations">
      <button id="clear">C</button>
      <button id="delete">⌫</button>
      <button id="enter">Invio</button>
    </div>
    
    <!-- Griglia dei tasti numerici: 4 righe a 3 colonne -->
    <div class="buttons">
      <!-- Riga 1: 7, 8, 9 -->
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <!-- Riga 2: 4, 5, 6 -->
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <!-- Riga 3: 1, 2, 3 -->
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <!-- Riga 4: pulsante vuoto, 0, pulsante vuoto -->
      <button onclick="window.location.href='index.html'">⌂ Home</button>
      <button data-value="0">0</button>
      <button disabled></button>
    </div>
  </div>

  <script>
    // Mappatura: definizione delle coppie numero-parola
    const mapping = {

      "95": "Palla",
      "96": "Bocce",
      "97": "Pacco",
      "98": "Puffo",
      "99": "Pippo"
    };

    const display = document.getElementById('display');
    const opButtons = document.querySelectorAll('.operations button');
    const numButtons = document.querySelectorAll('.buttons button');

    // Funzione per aggiornare il display
    function updateDisplay(value) {
      display.textContent = value;
    }

    // Operazioni: C, ⌫, Invio
    opButtons.forEach(button => {
      button.addEventListener('click', () => {
        const id = button.id;
        if (id === 'clear') {
          // Cancella tutto
          updateDisplay('');
        } else if (id === 'delete') {
          // Cancella l'ultimo carattere
          updateDisplay(display.textContent.slice(0, -1));
        } else if (id === 'enter') {
          // Conversione: suddivide il contenuto in gruppi di due cifre e sostituisce con la parola corrispondente
          const input = display.textContent;
          let result = [];
          for (let i = 0; i < input.length; i += 2) {
            let num = input.substring(i, i + 2);
            let word = mapping[num];
            if (!word) {
              word = `[${num}]`;
            }
            result.push(word);
          }
          updateDisplay(result.join(' '));
        }
      });
    });

    // Tasti numerici: aggiunge il valore cliccato al display
    numButtons.forEach(button => {
      if (!button.disabled) {
        button.addEventListener('click', () => {
          const value = button.getAttribute('data-value');
          updateDisplay(display.textContent + value);
        });
      }
    });
  </script>
</body>
</html>
