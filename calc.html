<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Calcolatore - Card Fonetica</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Converti una sequenza di numeri in parole secondo il sistema mnemonico fonetico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Card-Fonetica">
  <link rel="apple-touch-icon" href="card-192.png">
  <link rel="icon" type="image/png" href="card-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .calculator {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      animation: enter 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    @media (min-width: 720px) {
      .calculator { max-width: 480px; padding: 28px; }
    }
    .display {
      background: linear-gradient(145deg, #000 0%, #0d0d10 100%);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 1.6rem;
      text-align: right;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      min-height: 80px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
      -webkit-user-select: text;
      user-select: text;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      letter-spacing: 0.02em;
    }
    .display:empty::before {
      content: "0";
      color: var(--muted);
      text-shadow: none;
      opacity: 0.5;
    }
    .operations, .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .operations { margin-bottom: 10px; }
    .calculator button {
      padding: 20px 0;
      font-size: 1.25rem;
      font-weight: 600;
      min-height: 56px;
    }
    .calculator button[disabled] {
      background-color: transparent;
      border-color: transparent;
      cursor: default;
    }
    #enter {
      background-color: var(--accent);
      color: #001b0a;
      border-color: transparent;
      font-weight: 700;
    }
    #clear, #delete { color: var(--error); }
  </style>
</head>
<body>
  <button id="installBtn" class="hidden" type="button" aria-label="Installa applicazione">Installa</button>

  <main class="calculator" aria-label="Calcolatore numeri-parole">
    <div class="display" id="display" role="status" aria-live="polite" aria-label="Display"></div>

    <div class="operations">
      <button id="clear" aria-label="Cancella tutto">C</button>
      <button id="delete" aria-label="Cancella ultimo">⌫</button>
      <button id="enter" aria-label="Converti">Invio</button>
    </div>

    <div class="keys">
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button onclick="window.location.href='index.html'" aria-label="Torna alla home">⌂</button>
      <button data-value="0">0</button>
      <button disabled aria-hidden="true"></button>
    </div>
  </main>

  <script src="mapping.js"></script>
  <script>
    const display = document.getElementById('display');
    let rawInput = "";

    function render() { display.textContent = rawInput; }

    document.getElementById('clear').addEventListener('click', () => { rawInput = ""; render(); });
    document.getElementById('delete').addEventListener('click', () => {
      const text = display.textContent;
      if (text.includes(' ')) {
        rawInput = "";
        render();
      } else {
        rawInput = rawInput.slice(0, -1);
        render();
      }
    });
    document.getElementById('enter').addEventListener('click', () => {
      if (!rawInput) return;
      const result = [];
      for (let i = 0; i < rawInput.length; i += 2) {
        const num = rawInput.substring(i, i + 2);
        result.push(mapping[num] || `[${num}]`);
      }
      display.textContent = result.join(' ');
    });

    document.querySelectorAll('.keys button[data-value]').forEach(button => {
      button.addEventListener('click', () => {
        if (display.textContent.includes(' ')) rawInput = "";
        rawInput += button.getAttribute('data-value');
        render();
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') {
        if (display.textContent.includes(' ')) rawInput = "";
        rawInput += e.key;
        render();
      } else if (e.key === 'Backspace') {
        rawInput = rawInput.slice(0, -1);
        render();
      } else if (e.key === 'Enter') {
        document.getElementById('enter').click();
      } else if (e.key === 'Escape') {
        rawInput = "";
        render();
      }
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
