<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Calcolatore - Card Fonetica</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EFE9DF">
  <meta name="description" content="Converti una sequenza di numeri in parole secondo il sistema mnemonico fonetico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Card-Fonetica">
  <link rel="apple-touch-icon" href="card-192.png">
  <link rel="icon" type="image/png" href="card-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .calculator {
      background-color: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 28px 24px 22px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
      animation: enter 0.4s ease-out;
    }
    @media (min-width: 720px) {
      .calculator { max-width: 480px; padding: 32px 28px; }
    }
    .calc-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .calc-header h1 {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      font-weight: 500;
      color: var(--ink);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .calc-header .home-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      min-height: 0;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-soft);
      box-shadow: none;
    }
    .calc-header .home-btn:hover { background: var(--paper-2); color: var(--ink); }
    .display {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 1.65rem;
      text-align: right;
      padding: 20px 22px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      min-height: 88px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      -webkit-user-select: text;
      user-select: text;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.25s ease;
    }
    .display:empty::before {
      content: "0";
      color: var(--muted);
      opacity: 0.6;
    }
    .display.word-result {
      border-color: var(--sage);
      background: #FFFFFF;
      font-size: 1.3rem;
      text-align: center;
      justify-content: center;
      letter-spacing: 0;
    }
    .operations, .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .operations { margin-bottom: 10px; }
    .calculator button {
      padding: 18px 0;
      font-size: 1.3rem;
      font-weight: 500;
      font-family: var(--font-serif);
      min-height: 60px;
      letter-spacing: 0;
    }
    .calculator button[disabled] {
      background-color: transparent;
      border-color: transparent;
      cursor: default;
      visibility: hidden;
    }
    #clear  { color: var(--error); border-color: var(--border); }
    #delete { color: var(--text-soft); }
    #enter  { /* eredita .primary */ font-family: var(--font-sans); font-weight: 500; font-size: 0.95rem; }
  </style>
</head>
<body>
  <button id="installBtn" class="hidden" type="button" aria-label="Installa applicazione">Installa</button>

  <main class="calculator" aria-label="Calcolatore numeri-parole">
    <div class="calc-header">
      <h1>Calcolatore</h1>
      <button class="home-btn" onclick="window.location.href='index.html'" aria-label="Torna alla home">← Home</button>
    </div>

    <div class="display" id="display" role="status" aria-live="polite" aria-label="Display"></div>

    <div class="operations">
      <button id="clear" aria-label="Cancella tutto">C</button>
      <button id="delete" aria-label="Cancella ultimo">⌫</button>
      <button id="enter" class="primary" aria-label="Converti">Invio</button>
    </div>

    <div class="keys">
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button disabled aria-hidden="true"></button>
      <button data-value="0">0</button>
      <button disabled aria-hidden="true"></button>
    </div>
  </main>

  <script src="mapping.js"></script>
  <script>
    const display = document.getElementById('display');
    let rawInput = "";
    let showingResult = false;

    function render() {
      display.textContent = rawInput;
      display.classList.remove('word-result');
      showingResult = false;
    }

    document.getElementById('clear').addEventListener('click', () => { rawInput = ""; render(); });
    document.getElementById('delete').addEventListener('click', () => {
      if (showingResult) { rawInput = ""; render(); return; }
      rawInput = rawInput.slice(0, -1);
      render();
    });
    document.getElementById('enter').addEventListener('click', () => {
      if (!rawInput) return;
      const result = [];
      for (let i = 0; i < rawInput.length; i += 2) {
        const num = rawInput.substring(i, i + 2);
        result.push(mapping[num] || `[${num}]`);
      }
      display.textContent = result.join(' ');
      display.classList.add('word-result');
      showingResult = true;
    });

    document.querySelectorAll('.keys button[data-value]').forEach(button => {
      button.addEventListener('click', () => {
        if (showingResult) rawInput = "";
        rawInput += button.getAttribute('data-value');
        render();
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') {
        if (showingResult) rawInput = "";
        rawInput += e.key;
        render();
      } else if (e.key === 'Backspace') {
        if (showingResult) { rawInput = ""; render(); return; }
        rawInput = rawInput.slice(0, -1);
        render();
      } else if (e.key === 'Enter') {
        document.getElementById('enter').click();
      } else if (e.key === 'Escape') {
        rawInput = "";
        render();
      }
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
