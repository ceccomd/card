<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calcolatore - Card Fonetica</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EBE7DE">
  <meta name="description" content="Converti una sequenza di numeri in parole secondo il sistema mnemonico fonetico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Card-Fonetica">
  <link rel="apple-touch-icon" href="card-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="card-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="card-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="card-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .calculator {
      background: var(--surface);
      border: none;
      border-radius: var(--radius-lg);
      padding: 28px 24px 22px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--neu-raised-lg);
      animation: enter 0.4s ease-out;
    }
    @media (min-width: 720px) {
      .calculator { max-width: 480px; padding: 32px 28px; }
    }
    .calc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .calc-header h1 {
      font-family: var(--font-sans);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .calc-header .home-btn {
      background: var(--surface);
      border: none;
      border-radius: var(--pill);
      min-height: 0;
      padding: 9px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-soft);
      box-shadow: var(--neu-raised-sm);
    }
    .calc-header .home-btn:hover { color: var(--text); box-shadow: var(--neu-raised); }

    .voice-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .voice-bar button {
      flex: 1;
      background: var(--surface);
      border: none;
      border-radius: var(--pill);
      padding: 14px 16px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: var(--neu-raised-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: box-shadow 0.2s ease, color 0.2s ease;
      min-height: 0;
    }
    .voice-bar button:active { box-shadow: var(--neu-pressed-sm); }
    .voice-bar button[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: var(--neu-raised-sm);
    }
    .voice-bar .mic.listening {
      color: var(--sage-dark);
      box-shadow: var(--neu-pressed-sm);
    }
    .voice-bar .mic-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-soft);
    }
    .voice-bar .mic.listening .mic-dot {
      background: var(--sage-dark);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }
    .voice-hint {
      font-size: 0.78rem;
      color: var(--text-soft);
      text-align: center;
      margin: -6px 0 12px;
      min-height: 1.2em;
    }

    .display {
      background: var(--surface);
      border: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 1.8rem;
      text-align: right;
      padding: 24px 28px;
      border-radius: 22px;
      margin-bottom: 18px;
      min-height: 96px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      -webkit-user-select: text;
      user-select: text;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-shadow: var(--neu-pressed);
      transition: color 0.25s ease;
    }
    .display:empty::before {
      content: "0";
      color: var(--muted);
      opacity: 0.7;
    }
    .display.word-result {
      color: var(--sage-dark);
      font-size: 1.4rem;
      text-align: center;
      justify-content: center;
      letter-spacing: -0.01em;
      font-weight: 700;
    }
    .operations, .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .operations { margin-bottom: 12px; }
    .calculator button {
      padding: 18px 0;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: var(--font-sans);
      min-height: 64px;
      letter-spacing: -0.01em;
      border-radius: var(--pill);
    }
    .calculator .voice-bar button { padding: 14px 16px; font-size: 0.95rem; min-height: 0; }
    .calculator button[disabled] {
      background: transparent;
      box-shadow: none;
      cursor: default;
      visibility: hidden;
    }
    .calculator .voice-bar button[disabled] {
      background: var(--surface);
      box-shadow: var(--neu-raised-sm);
      visibility: visible;
      cursor: not-allowed;
    }
    #clear  { color: var(--error); }
    #delete { color: var(--text-soft); }
    #enter  { /* eredita .primary */ font-size: 1.05rem; }
  </style>
</head>
<body>
  <button id="installBtn" class="hidden" type="button" aria-label="Installa applicazione">Installa</button>

  <main class="calculator" aria-label="Calcolatore numeri-parole">
    <div class="calc-header">
      <h1>Calcolatore</h1>
      <button class="home-btn" onclick="window.location.href='index.html'" aria-label="Torna alla home">← Home</button>
    </div>

    <div class="voice-bar">
      <button class="mic" id="micBtn" type="button" aria-label="Detta un numero">
        <span class="mic-dot" aria-hidden="true"></span><span id="micLabel">Detta numero</span>
      </button>
      <button id="replayBtn" type="button" aria-label="Rileggi il risultato" disabled>
        🔊 Rileggi
      </button>
    </div>
    <p class="voice-hint" id="voiceHint">Premi il microfono e di' il numero (es. "milleecentoventiquattro" o "uno uno due quattro")</p>

    <div class="display" id="display" role="status" aria-live="polite" aria-label="Display"></div>

    <div class="operations">
      <button id="clear" aria-label="Cancella tutto">C</button>
      <button id="delete" aria-label="Cancella ultimo">⌫</button>
      <button id="enter" class="primary" aria-label="Converti">Invio</button>
    </div>

    <div class="keys">
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button disabled aria-hidden="true"></button>
      <button data-value="0">0</button>
      <button disabled aria-hidden="true"></button>
    </div>
  </main>

  <script src="mapping.js"></script>
  <script src="voice-core.js"></script>
  <script>
    const display = document.getElementById('display');
    const replayBtn = document.getElementById('replayBtn');
    let rawInput = "";
    let showingResult = false;
    let lastWords = "";

    function render() {
      display.textContent = rawInput;
      display.classList.remove('word-result');
      showingResult = false;
    }

    function convert() {
      if (!rawInput) return;
      const result = [];
      for (let i = 0; i < rawInput.length; i += 2) {
        const num = rawInput.substring(i, i + 2);
        result.push(mapping[num] || `[${num}]`);
      }
      lastWords = result.join(' ');
      display.textContent = lastWords;
      display.classList.add('word-result');
      showingResult = true;
      replayBtn.disabled = false;
      // Legge il risultato a voce
      if (window.VoiceCore && VoiceCore.supported) {
        VoiceCore.speak(lastWords, { rate: 0.9 });
      }
    }

    document.getElementById('clear').addEventListener('click', () => {
      rawInput = "";
      render();
      replayBtn.disabled = true;
      lastWords = "";
    });
    document.getElementById('delete').addEventListener('click', () => {
      if (showingResult) { rawInput = ""; render(); replayBtn.disabled = true; lastWords = ""; return; }
      rawInput = rawInput.slice(0, -1);
      render();
    });
    document.getElementById('enter').addEventListener('click', convert);

    document.querySelectorAll('.keys button[data-value]').forEach(button => {
      button.addEventListener('click', () => {
        if (showingResult) rawInput = "";
        rawInput += button.getAttribute('data-value');
        render();
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') {
        if (showingResult) rawInput = "";
        rawInput += e.key;
        render();
      } else if (e.key === 'Backspace') {
        if (showingResult) { rawInput = ""; render(); replayBtn.disabled = true; lastWords = ""; return; }
        rawInput = rawInput.slice(0, -1);
        render();
      } else if (e.key === 'Enter') {
        convert();
      } else if (e.key === 'Escape') {
        rawInput = "";
        render();
        replayBtn.disabled = true;
        lastWords = "";
      }
    });

    // ---- Voce ----
    const micBtn = document.getElementById('micBtn');
    const micLabel = document.getElementById('micLabel');
    const voiceHint = document.getElementById('voiceHint');

    if (!window.VoiceCore || !VoiceCore.supported) {
      micBtn.disabled = true;
      replayBtn.disabled = true;
      voiceHint.textContent = 'La voce non è supportata su questo browser. Prova Chrome o Safari aggiornati.';
    } else {
      let listening = false;
      let recognizer = null;

      function setListeningUI(on) {
        listening = on;
        micBtn.classList.toggle('listening', on);
        micLabel.textContent = on ? 'Ascolto...' : 'Detta numero';
      }

      function startListening() {
        if (listening) return;
        VoiceCore.cancelSpeech();
        voiceHint.textContent = 'Parla quando vuoi...';
        recognizer = VoiceCore.createRecognizer({
          onStart: () => setListeningUI(true),
          onResult: (alts) => {
            setListeningUI(false);
            // Prova le alternative in ordine, prendi la prima che dà cifre valide
            let digits = '';
            for (const a of alts) {
              digits = VoiceCore.speechToDigits(a);
              if (digits) break;
            }
            if (!digits) {
              voiceHint.textContent = `Non ho capito un numero (« ${alts[0] || ''} »). Riprova.`;
              return;
            }
            voiceHint.textContent = `Sentito: « ${alts[0]} »`;
            rawInput = digits;
            render();
            convert();
          },
          onNoSpeech: () => {
            setListeningUI(false);
            voiceHint.textContent = 'Non ho sentito. Premi di nuovo il microfono e parla.';
          },
          onError: (err) => {
            setListeningUI(false);
            if (err === 'not-allowed') {
              voiceHint.textContent = 'Permesso microfono negato. Abilitalo nelle impostazioni del browser.';
            } else {
              voiceHint.textContent = 'Errore microfono: ' + err;
            }
          }
        });
        recognizer.start();
      }

      function stopListening() {
        if (recognizer) recognizer.abort();
        setListeningUI(false);
        voiceHint.textContent = 'Premi il microfono per dettare un numero';
      }

      micBtn.addEventListener('click', () => {
        if (listening) stopListening();
        else startListening();
      });

      replayBtn.addEventListener('click', () => {
        if (lastWords) VoiceCore.speak(lastWords, { rate: 0.9 });
      });
    }
  </script>
  <script src="pwa.js"></script>
</body>
</html>
