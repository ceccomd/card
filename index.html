<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Card Fonetica - Allenamento Mnemonico</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EBE7DE">
  <meta name="description" content="Allena la memoria associando numeri a parole con il sistema mnemonico fonetico.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Card-Fonetica">
  <link rel="apple-touch-icon" href="card-192.png">
  <link rel="icon" type="image/png" href="card-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .flashcard {
      background: var(--surface);
      border: none;
      border-radius: 28px;
      padding: 44px 20px;
      font-family: var(--font-sans);
      font-size: 3.4rem;
      margin: 14px 0;
      min-height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      box-shadow: var(--neu-raised-lg);
      transition: box-shadow 0.3s ease, color 0.3s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .flashcard.flip { animation: cardFade 0.32s ease; }
    .flashcard.win  { color: var(--sage-dark); }
    .flashcard.lose { color: var(--error); animation: cardShake 0.32s; }
    @keyframes cardFade {
      0%   { opacity: 0.3; transform: translateY(6px); }
      100% { opacity: 1;   transform: none; }
    }
    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-5px); }
      50%      { transform: translateX(5px); }
      75%      { transform: translateX(-3px); }
    }

    .feedback {
      margin-top: 14px;
      font-size: 0.88rem;
      min-height: 1.4em;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .feedback.correct { color: var(--sage-dark); }
    .feedback.error   { color: var(--error); }

    .stats {
      display: flex;
      gap: 12px;
      margin: 12px 0 18px;
    }
    .stats .chip {
      flex: 1;
      background: var(--surface);
      border: none;
      border-radius: 18px;
      padding: 12px 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: var(--neu-raised-sm);
      transition: box-shadow 0.3s ease, color 0.3s ease;
    }
    .stats .stat-value {
      font-family: var(--font-sans);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stats .stat-label {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .chip.streak.active {
      box-shadow: var(--neu-pressed-sm);
    }
    .chip.streak.active .stat-value { color: var(--sage-dark); }

    .brand {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 4px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
      box-shadow: var(--neu-raised);
    }
    .brand h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 2px;
      letter-spacing: -0.025em;
    }
    .brand .subtitle {
      font-size: 0.88rem;
      margin: 0;
    }

    .game-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .game-header h1 { font-size: 1.4rem; }
  </style>
</head>
<body>
  <button id="installBtn" class="hidden" type="button" aria-label="Installa applicazione">Installa</button>

  <main id="menu" class="container" aria-labelledby="menu-title">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">Cf</div>
      <h1 id="menu-title">Card Fonetica</h1>
      <p class="subtitle">Sistema mnemonico fonetico</p>
    </div>
    <div class="stack">
      <button id="classicModeBtn" class="primary">Gioco Classico</button>
      <button id="rangeModeBtn">Gioco Range</button>
      <button id="multiModeBtn">Multi-Cifre</button>
      <button onclick="window.location.href='calc.html'">Calcolatore</button>
    </div>
  </main>

  <section id="classicGame" class="container hidden" aria-labelledby="classic-title">
    <div class="game-header"><h1 id="classic-title">Gioco Classico</h1></div>
    <p class="subtitle">Scrivi la parola corrispondente al numero</p>
    <div class="stats" role="status" aria-live="polite">
      <div class="chip"><span class="stat-value" id="classicCorrect">0</span><span class="stat-label">Corrette</span></div>
      <div class="chip"><span class="stat-value" id="classicTotal">0</span><span class="stat-label">Totali</span></div>
      <div class="chip streak" id="classicStreakChip"><span class="stat-value" id="classicStreak">0</span><span class="stat-label">Streak</span></div>
    </div>
    <div class="flashcard" id="classicFlashcard" role="img" aria-label="Numero da indovinare"></div>
    <input type="text" id="classicAnswer" placeholder="Risposta" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Inserisci la parola">
    <div class="row" style="margin-top:10px;">
      <button id="classicCheckBtn" class="primary">Controlla</button>
      <button id="classicNextBtn" class="ghost">Prossimo</button>
    </div>
    <div class="feedback" id="classicFeedback" role="status" aria-live="polite"></div>
    <button class="back-btn" onclick="showSection('menu')">← Torna al Menu</button>
  </section>

  <section id="rangeGame" class="container hidden" aria-labelledby="range-title">
    <div class="game-header"><h1 id="range-title">Gioco Range</h1></div>
    <p class="subtitle">Limita l'allenamento a un intervallo</p>
    <div class="row">
      <input type="number" id="rangeMin" placeholder="Min" inputmode="numeric" aria-label="Numero minimo">
      <input type="number" id="rangeMax" placeholder="Max" inputmode="numeric" aria-label="Numero massimo">
    </div>
    <button id="rangeStartBtn" class="primary" style="margin-top:10px;width:100%;">Avvia</button>
    <div class="stats" role="status" aria-live="polite">
      <div class="chip"><span class="stat-value" id="rangeCorrect">0</span><span class="stat-label">Corrette</span></div>
      <div class="chip"><span class="stat-value" id="rangeTotal">0</span><span class="stat-label">Totali</span></div>
      <div class="chip streak" id="rangeStreakChip"><span class="stat-value" id="rangeStreak">0</span><span class="stat-label">Streak</span></div>
    </div>
    <div class="flashcard" id="rangeFlashcard" role="img" aria-label="Numero da indovinare"></div>
    <input type="text" id="rangeAnswer" placeholder="Risposta" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Inserisci la parola">
    <div class="row" style="margin-top:10px;">
      <button id="rangeCheckBtn" class="primary">Controlla</button>
      <button id="rangeNextBtn" class="ghost">Prossimo</button>
    </div>
    <div class="feedback" id="rangeFeedback" role="status" aria-live="polite"></div>
    <button class="back-btn" onclick="showSection('menu')">← Torna al Menu</button>
  </section>

  <section id="multiGame" class="container hidden" aria-labelledby="multi-title">
    <div class="game-header"><h1 id="multi-title">Multi-Cifre</h1></div>
    <p class="subtitle">Scomponi un numero lungo in parole</p>
    <input type="number" id="multiDigits" placeholder="Numero di cifre (es. 6)" min="1" inputmode="numeric" aria-label="Numero di cifre">
    <button id="multiStartBtn" class="primary" style="margin-top:10px;width:100%;">Avvia</button>
    <div class="stats" role="status" aria-live="polite">
      <div class="chip"><span class="stat-value" id="multiCorrect">0</span><span class="stat-label">Corrette</span></div>
      <div class="chip"><span class="stat-value" id="multiTotal">0</span><span class="stat-label">Totali</span></div>
      <div class="chip streak" id="multiStreakChip"><span class="stat-value" id="multiStreak">0</span><span class="stat-label">Streak</span></div>
    </div>
    <div class="flashcard" id="multiFlashcard" role="img" aria-label="Sequenza da decodificare"></div>
    <input type="text" id="multiAnswer" placeholder="Parole separate da spazi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Inserisci le parole">
    <div class="row" style="margin-top:10px;">
      <button id="multiCheckBtn" class="primary">Controlla</button>
      <button id="multiNextBtn" class="ghost">Prossimo</button>
    </div>
    <div class="feedback" id="multiFeedback" role="status" aria-live="polite"></div>
    <button class="back-btn" onclick="showSection('menu')">← Torna al Menu</button>
  </section>

  <script src="mapping.js"></script>
  <script>
    function showSection(sectionId) {
      document.querySelectorAll('.container').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
    }

    function flashCard(el) {
      el.classList.remove('flip', 'win', 'lose');
      void el.offsetWidth;
      el.classList.add('flip');
    }

    function updateStats(prefix, state) {
      document.getElementById(prefix + 'Correct').textContent = state.correct;
      document.getElementById(prefix + 'Total').textContent = state.total;
      document.getElementById(prefix + 'Streak').textContent = state.streak;
      const chip = document.getElementById(prefix + 'StreakChip');
      if (chip) chip.classList.toggle('active', state.streak > 0);
    }

    function setFeedback(el, isCorrect, message, opts) {
      el.textContent = message;
      el.className = 'feedback ' + (isCorrect ? 'correct' : 'error');
      if (opts && opts.flashcard) {
        opts.flashcard.classList.remove('flip', 'win', 'lose');
        void opts.flashcard.offsetWidth;
        opts.flashcard.classList.add(isCorrect ? 'win' : 'lose');
      }
      if (opts && isCorrect && opts.streak > 0 && opts.streak % 5 === 0) {
        showStreakToast(opts.streak);
      }
    }

    function showStreakToast(n) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const t = document.createElement('div');
      t.className = 'streak-toast';
      t.textContent = `Streak ${n}`;
      t.setAttribute('aria-hidden', 'true');
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    document.getElementById('classicModeBtn').addEventListener('click', () => {
      showSection('classicGame');
      showClassicCard();
    });
    document.getElementById('rangeModeBtn').addEventListener('click', () => {
      showSection('rangeGame');
      resetRangeGame();
    });
    document.getElementById('multiModeBtn').addEventListener('click', () => {
      showSection('multiGame');
      resetMultiGame();
    });

    // --- Gioco Classico ---
    const classicState = { correct: 0, total: 0, streak: 0, answered: false };
    let currentClassicKey = "";
    const classicKeys = Object.keys(mapping);

    function showClassicCard() {
      currentClassicKey = classicKeys[Math.floor(Math.random() * classicKeys.length)];
      const card = document.getElementById('classicFlashcard');
      card.textContent = currentClassicKey;
      flashCard(card);
      document.getElementById('classicAnswer').value = "";
      const fb = document.getElementById('classicFeedback');
      fb.textContent = "";
      fb.className = "feedback";
      classicState.answered = false;
      document.getElementById('classicAnswer').focus();
    }
    function checkClassicAnswer() {
      if (classicState.answered) return;
      const userAns = document.getElementById('classicAnswer').value.trim().toLowerCase();
      if (!userAns) return;
      const correctAns = mapping[currentClassicKey].toLowerCase();
      const ok = userAns === correctAns;
      classicState.total++;
      if (ok) { classicState.correct++; classicState.streak++; }
      else    { classicState.streak = 0; }
      classicState.answered = true;
      setFeedback(
        document.getElementById('classicFeedback'),
        ok,
        ok ? "Corretto" : `Risposta: ${mapping[currentClassicKey]}`,
        {
          flashcard: document.getElementById('classicFlashcard'),
          streak: classicState.streak
        }
      );
      updateStats('classic', classicState);
    }
    document.getElementById('classicCheckBtn').addEventListener('click', checkClassicAnswer);
    document.getElementById('classicNextBtn').addEventListener('click', showClassicCard);
    document.getElementById('classicAnswer').addEventListener('keydown', e => {
      if (e.key === 'Enter') classicState.answered ? showClassicCard() : checkClassicAnswer();
    });

    // --- Gioco Range ---
    const rangeState = { correct: 0, total: 0, streak: 0, answered: false };
    let rangeKeys = [];
    let currentRangeKey = "";

    function resetRangeGame() {
      document.getElementById('rangeMin').value = "";
      document.getElementById('rangeMax').value = "";
      document.getElementById('rangeFlashcard').textContent = "";
      document.getElementById('rangeFeedback').textContent = "";
      document.getElementById('rangeFeedback').className = "feedback";
      document.getElementById('rangeAnswer').value = "";
      rangeKeys = [];
      rangeState.correct = rangeState.total = rangeState.streak = 0;
      rangeState.answered = false;
      updateStats('range', rangeState);
    }
    function showRangeCard() {
      const flashcardEl = document.getElementById('rangeFlashcard');
      const feedbackEl = document.getElementById('rangeFeedback');
      if (rangeKeys.length === 0) {
        flashcardEl.textContent = "Nessun numero in questo intervallo";
        feedbackEl.textContent = "";
        return;
      }
      currentRangeKey = rangeKeys[Math.floor(Math.random() * rangeKeys.length)];
      flashcardEl.textContent = currentRangeKey;
      flashCard(flashcardEl);
      document.getElementById('rangeAnswer').value = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      rangeState.answered = false;
      document.getElementById('rangeAnswer').focus();
    }
    function checkRangeAnswer() {
      if (rangeState.answered || rangeKeys.length === 0) return;
      const userAns = document.getElementById('rangeAnswer').value.trim().toLowerCase();
      if (!userAns) return;
      const correctAns = mapping[currentRangeKey].toLowerCase();
      const ok = userAns === correctAns;
      rangeState.total++;
      if (ok) { rangeState.correct++; rangeState.streak++; }
      else    { rangeState.streak = 0; }
      rangeState.answered = true;
      setFeedback(
        document.getElementById('rangeFeedback'),
        ok,
        ok ? "Corretto" : `Risposta: ${mapping[currentRangeKey]}`,
        {
          flashcard: document.getElementById('rangeFlashcard'),
          streak: rangeState.streak
        }
      );
      updateStats('range', rangeState);
    }
    document.getElementById('rangeStartBtn').addEventListener('click', () => {
      const minVal = parseInt(document.getElementById('rangeMin').value, 10);
      const maxVal = parseInt(document.getElementById('rangeMax').value, 10);
      if (isNaN(minVal) || isNaN(maxVal) || minVal > maxVal) {
        alert("Inserisci un intervallo valido");
        return;
      }
      rangeKeys = Object.keys(mapping).filter(key => {
        const n = parseInt(key, 10);
        return !isNaN(n) && n >= minVal && n <= maxVal;
      });
      rangeState.correct = rangeState.total = rangeState.streak = 0;
      updateStats('range', rangeState);
      showRangeCard();
    });
    document.getElementById('rangeCheckBtn').addEventListener('click', checkRangeAnswer);
    document.getElementById('rangeNextBtn').addEventListener('click', showRangeCard);
    document.getElementById('rangeAnswer').addEventListener('keydown', e => {
      if (e.key === 'Enter') rangeState.answered ? showRangeCard() : checkRangeAnswer();
    });

    // --- Gioco Multi-Cifre ---
    const multiState = { correct: 0, total: 0, streak: 0, answered: false };
    let currentMultiNumber = "";
    let multiGroups = [];

    function resetMultiGame() {
      document.getElementById('multiDigits').value = "";
      document.getElementById('multiFlashcard').textContent = "";
      document.getElementById('multiFeedback').textContent = "";
      document.getElementById('multiFeedback').className = "feedback";
      document.getElementById('multiAnswer').value = "";
      currentMultiNumber = "";
      multiGroups = [];
      multiState.correct = multiState.total = multiState.streak = 0;
      multiState.answered = false;
      updateStats('multi', multiState);
    }
    function generateMultiNumber(numDigits) {
      let result = "";
      for (let i = 0; i < numDigits; i++) {
        result += Math.floor(Math.random() * 10).toString();
      }
      return result;
    }
    function splitIntoGroups(numStr) {
      const groups = [];
      for (let i = 0; i < numStr.length; i += 2) {
        groups.push(numStr.substring(i, i + 2));
      }
      return groups;
    }
    function showMultiCard() {
      const numDigits = parseInt(document.getElementById('multiDigits').value, 10);
      if (isNaN(numDigits) || numDigits < 1) {
        alert("Inserisci un numero valido di cifre");
        return;
      }
      currentMultiNumber = generateMultiNumber(numDigits);
      multiGroups = splitIntoGroups(currentMultiNumber);
      const card = document.getElementById('multiFlashcard');
      card.textContent = currentMultiNumber;
      flashCard(card);
      document.getElementById('multiAnswer').value = "";
      const fb = document.getElementById('multiFeedback');
      fb.textContent = "";
      fb.className = "feedback";
      multiState.answered = false;
      document.getElementById('multiAnswer').focus();
    }
    function checkMultiAnswer() {
      if (multiState.answered || multiGroups.length === 0) return;
      const userAns = document.getElementById('multiAnswer').value.trim().toLowerCase();
      if (!userAns) return;
      const userWords = userAns.split(/\s+/);
      let correct = true;
      const correctAnswers = [];
      for (let i = 0; i < multiGroups.length; i++) {
        const group = multiGroups[i];
        const correctWord = mapping[group] || `[${group}]`;
        correctAnswers.push(correctWord);
        if (!userWords[i] || userWords[i].toLowerCase() !== correctWord.toLowerCase()) {
          correct = false;
        }
      }
      multiState.total++;
      if (correct) { multiState.correct++; multiState.streak++; }
      else         { multiState.streak = 0; }
      multiState.answered = true;
      setFeedback(
        document.getElementById('multiFeedback'),
        correct,
        correct ? "Corretto" : `Risposte: ${correctAnswers.join(' ')}`,
        {
          flashcard: document.getElementById('multiFlashcard'),
          streak: multiState.streak
        }
      );
      updateStats('multi', multiState);
    }
    document.getElementById('multiStartBtn').addEventListener('click', showMultiCard);
    document.getElementById('multiCheckBtn').addEventListener('click', checkMultiAnswer);
    document.getElementById('multiNextBtn').addEventListener('click', showMultiCard);
    document.getElementById('multiAnswer').addEventListener('keydown', e => {
      if (e.key === 'Enter') multiState.answered ? showMultiCard() : checkMultiAnswer();
    });

    // Deep link per gli shortcut PWA
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');
    if (mode === 'classic') { showSection('classicGame'); showClassicCard(); }
    else if (mode === 'range') { showSection('rangeGame'); resetRangeGame(); }
    else if (mode === 'multi') { showSection('multiGame'); resetMultiGame(); }
  </script>
  <script src="pwa.js"></script>
</body>
</html>
